name: TechOrvia Verified News Links
on:
  schedule:
    - cron: "27 4,12,20 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: techorvia-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch metadata from trusted RSS sources
        run: node scripts/update-techorvia-news.mjs
      - name: Commit verified headline links if changed
        run: |
          if ! git diff --quiet -- sites/techorvia/news.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sites/techorvia/news.json
            git commit -m "Update TechOrvia curated technology news links"
            git push origin HEAD:main
          fi
