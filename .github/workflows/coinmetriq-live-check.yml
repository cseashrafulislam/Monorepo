name: CoinMetriq public production health
on:
  workflow_dispatch:
  schedule:
    - cron: "19 5 * * 1,4"
  workflow_run:
    workflows: ["Monorepo quality checks"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  checks: read
concurrency:
  group: coinmetriq-public-health
  cancel-in-progress: true
jobs:
  verify-public-host:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COINMETRIQ_LIVE_BASE: ${{ vars.COINMETRIQ_LIVE_BASE || 'https://coinmetriq.pages.dev' }}
      COINMETRIQ_EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Cloudflare Pages GitHub check against expected release commit
        run: node scripts/coinmetriq-verify-cloudflare-check.mjs
      - name: Check actual live pages, precise build SHA, canonical and sitemap
        run: node scripts/coinmetriq-live-health.mjs
      - name: Preserve release and public delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coinmetriq-public-health
          path: |
            dist/coinmetriq-deployment-check.json
            dist/coinmetriq-production-check.json
          if-no-files-found: warn
          retention-days: 14
