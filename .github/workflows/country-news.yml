name: Country-aware News Editions
on:
  schedule:
    - cron: "37 3,11,19 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/country-news.yml
permissions:
  contents: write
concurrency:
  group: country-news-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh verified country-aware news
        run: node scripts/update-country-news.mjs
      - name: Commit new headlines when changed
        run: |
          if ! git diff --quiet -- sites/*/news.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sites/*/news.json
            git commit -m "Refresh country-aware news feeds"
            git push origin HEAD:main
          fi
