name: Monorepo quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and build all ten sites
        run: npm run check
      - name: CoinMetriq offline SEO, canonical and internal link audit
        run: npm run audit:coinmetriq
      - name: Browser smoke-test CoinMetriq research and portfolio
        run: npm run smoke:coinmetriq
      - name: Browser smoke-test TechOrvia tools
        run: node scripts/techorvia-browser-smoke.mjs
      - name: Browser smoke-test country editions
        run: node scripts/country-browser-smoke.mjs
